[output]
dir = "./showcase"

# ── Template previews (page 1 of each generated PDF) ──

[[scenes]]
type = "web"
uri = "showcase/pdfs/modern-html.pdf"
name = "modern-html"
viewport = { width = 1200, height = 1553 }
full_page = true
formats = [{ output_type = "png" }]

[[scenes]]
type = "web"
uri = "showcase/pdfs/modern-latex.pdf"
name = "modern-latex"
viewport = { width = 1200, height = 1553 }
full_page = true
formats = [{ output_type = "png" }]

[[scenes]]
type = "web"
uri = "showcase/pdfs/modern-cv.pdf"
name = "modern-cv"
viewport = { width = 1200, height = 1553 }
full_page = true
formats = [{ output_type = "png" }]

[[scenes]]
type = "web"
uri = "showcase/pdfs/modern-docx.pdf"
name = "modern-docx"
viewport = { width = 1200, height = 1553 }
full_page = true
formats = [{ output_type = "png" }]

# ── Terminal demo ──

[[scenes]]
type = "terminal"
name = "demo-cli"
theme = "dracula"
cols = 100
rows = 30
command = "incipit generate assets/example_resumes/software_engineer.json -t modern-html -o outputs"
formats = [{ output_type = "gif" }]
frame_duration = 80

[[scenes.interactions]]
type = "wait"
duration = 8000
